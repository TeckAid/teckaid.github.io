<svg xmlns="http://www.w3.org/2000/svg" width="320" height="64" viewBox="0 0 320 64" fill="none" role="img" aria-label="TeckAid">
  <defs>
    <linearGradient id="taGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="taWord" x1="76" y1="20" x2="300" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <!-- Mark: rounded square with agent node network -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#taGrad)"/>
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="32" x2="18" y2="18"/>
    <line x1="32" y1="32" x2="46" y2="18"/>
    <line x1="32" y1="32" x2="32" y2="48"/>
  </g>
  <circle cx="32" cy="32" r="6" fill="#FFFFFF"/>
  <circle cx="18" cy="18" r="4" fill="#FFFFFF"/>
  <circle cx="46" cy="18" r="4" fill="#A5F3FC"/>
  <circle cx="32" cy="48" r="4" fill="#FFFFFF"/>

  <!-- Wordmark -->
  <text x="76" y="42" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5" fill="url(#taWord)">Teck<tspan fill="#2563EB">Aid</tspan></text>
</svg>
