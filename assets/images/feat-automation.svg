<svg xmlns="http://www.w3.org/2000/svg" width="520" height="420" viewBox="0 0 520 420" fill="none" role="img" aria-label="Process automation pipeline">
  <defs>
    <linearGradient id="pBg" x1="0" y1="0" x2="520" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFF6FF"/><stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="pMark" x1="200" y1="140" x2="320" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="520" height="420" rx="24" fill="url(#pBg)"/>
  <!-- pipeline nodes -->
  <g>
    <rect x="70" y="190" width="90" height="60" rx="16" fill="#FFFFFF" stroke="#BFDBFE"/>
    <circle cx="100" cy="220" r="10" fill="#2563EB"/><rect x="118" y="212" width="32" height="7" rx="3" fill="#BFDBFE"/><rect x="118" y="226" width="22" height="7" rx="3" fill="#DBEAFE"/>

    <rect x="215" y="190" width="90" height="60" rx="16" fill="#FFFFFF" stroke="#BFDBFE"/>
    <circle cx="245" cy="220" r="10" fill="#0EA5E9"/><rect x="263" y="212" width="32" height="7" rx="3" fill="#BFDBFE"/><rect x="263" y="226" width="22" height="7" rx="3" fill="#DBEAFE"/>

    <rect x="360" y="190" width="90" height="60" rx="16" fill="#FFFFFF" stroke="#BFDBFE"/>
    <circle cx="390" cy="220" r="10" fill="#06B6D4"/><rect x="408" y="212" width="32" height="7" rx="3" fill="#BFDBFE"/><rect x="408" y="226" width="22" height="7" rx="3" fill="#DBEAFE"/>
  </g>
  <!-- arrows -->
  <g stroke="#93C5FD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M162 220 H210"/>
    <path d="M307 220 H354"/>
  </g>
  <!-- gear on top -->
  <g transform="translate(260 90)">
    <circle r="30" fill="url(#pMark)"/>
    <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-22" x2="0" y2="-12"/><line x1="0" y1="22" x2="0" y2="12"/>
      <line x1="-22" y1="0" x2="-12" y2="0"/><line x1="22" y1="0" x2="12" y2="0"/>
      <line x1="-15" y1="-15" x2="-8" y2="-8"/><line x1="15" y1="15" x2="8" y2="8"/>
      <line x1="15" y1="-15" x2="8" y2="-8"/><line x1="-15" y1="15" x2="-8" y2="8"/>
    </g>
    <circle r="9" fill="#FFFFFF"/>
  </g>
  <g fill="#38BDF8"><circle cx="120" cy="120" r="4"/><circle cx="410" cy="120" r="5"/></g>
</svg>
